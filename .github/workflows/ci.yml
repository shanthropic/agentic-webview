name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-runtime/package-lock.json

      - name: Check and build web runtime
        working-directory: web-runtime
        run: |
          npm ci
          npm run check

      - name: Build documentation website
        working-directory: website
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Validate canonical documentation links
        run: node scripts/validate-doc-links.mjs

      - name: Validate architecture boundaries
        run: node scripts/validate-architecture.mjs

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build library
        run: ./gradlew :browser-api:test :browser-api:jar :agent-tools:test :agent-tools:jar :integrations:jsonrpc:test :integrations:jsonrpc:jar :integrations:koog:check :integrations:koog:jar :browser-webview:testDebugUnitTest :browser-webview:assembleRelease :browser-compose:testDebugUnitTest :browser-compose:assembleRelease :samples:android:assembleDebug

      - name: Enforce artifact-size budgets
        run: node scripts/check-artifact-sizes.mjs --require-built

      - name: Lint
        run: ./gradlew :browser-webview:lint :browser-compose:lint :samples:android:lint

      - name: Validate publication metadata and consumer rules
        run: ./gradlew generatePomFileForMavenPublication :browser-webview:assembleRelease

  instrumented:
    name: Android instrumentation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install runtime dependencies
        working-directory: web-runtime
        run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run deterministic WebView instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: ./gradlew :browser-webview:connectedDebugAndroidTest
