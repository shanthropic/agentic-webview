name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-injector/package-lock.json

      - name: Build web-injector
        working-directory: web-injector
        run: |
          npm ci
          npm run build

      - name: Copy web-injector bundle to assets
        run: |
          mkdir -p agentic-webview/src/main/assets
          cp web-injector/dist/agentic_core.min.js agentic-webview/src/main/assets/

      - name: Build library
        run: ./gradlew :agentic-webview:assembleRelease

      - name: Lint
        run: ./gradlew :agentic-webview:lint
