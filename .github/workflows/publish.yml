name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: web-runtime/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same gate as CI. Builds every artifact, including the demo APK,
      # before anything is published.
      - name: Deterministic check
        run: ./gradlew deterministicCheck

      - name: Prepare demo APK and checksum
        working-directory: samples/android/build/outputs/apk/debug
        run: |
          APK="agentic-webview-demo-${{ steps.version.outputs.VERSION }}.apk"
          mv android-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish all SDK modules to Maven Central
        run: >-
          ./gradlew
          :browser-api:publishAndReleaseToMavenCentral
          :browser-webview:publishAndReleaseToMavenCentral
          :browser-compose:publishAndReleaseToMavenCentral
          :agent-tools:publishAndReleaseToMavenCentral
          :integrations:koog:publishAndReleaseToMavenCentral
          :integrations:jsonrpc:publishAndReleaseToMavenCentral
          --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          tag_name: ${{ github.ref_name }}
          files: |
            samples/android/build/outputs/apk/debug/agentic-webview-demo-${{ steps.version.outputs.VERSION }}.apk
            samples/android/build/outputs/apk/debug/agentic-webview-demo-${{ steps.version.outputs.VERSION }}.apk.sha256
