name: Build Demo App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-demo:
    name: Build Demo APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-runtime/package-lock.json

      - name: Check web runtime
        working-directory: web-runtime
        run: |
          npm ci
          npm run check

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate architecture boundaries
        run: node scripts/validate-architecture.mjs

      - name: Build demo app
        run: ./gradlew :samples:android:assembleDebug
